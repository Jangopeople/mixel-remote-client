name: windows-namespace-trace

on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - '.github/workflows/windows-namespace-trace.yml'
      - 'scripts/windows-namespace-cdb.py'
      - 'scripts/windows_namespace_probe.py'
      - 'scripts/test-windows-namespace-cdb.py'
      - 'scripts/test-windows-namespace-trace.ps1'

permissions:
  contents: read

jobs:
  source-only-native-call-trace:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.75'
      - name: Qualify the installed native MSVC environment
        shell: pwsh
        run: ./scripts/activate-windows-msvc.ps1 -ExportToGitHubEnvironment
      - name: Verify bounded hardware command and parser controls
        shell: pwsh
        run: |
          python scripts/test-windows-namespace-cdb.py
          if ($LASTEXITCODE -ne 0) { throw 'Bounded source-only hardware command/parser controls failed.' }
          ./scripts/test-windows-standard-namespace-access.ps1
      - name: Prepare the Microsoft source-only call debugger
        shell: pwsh
        run: |
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64/cdb.exe'
          if (-not (Test-Path $cdb)) {
            $setup = Join-Path $env:RUNNER_TEMP 'mixel-debugger-sdk-setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2173743' -OutFile $setup
            $signature = Get-AuthenticodeSignature $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'Source-only debugger SDK installer is not validly signed by Microsoft.'
            }
            $installer = Start-Process $setup -ArgumentList '/features','OptionId.WindowsDesktopDebuggers','/q','/norestart' -PassThru -Wait
            if ($installer.ExitCode -notin @(0,3010) -or -not (Test-Path $cdb)) { throw 'Microsoft source-only debugger preparation failed.' }
            Remove-Item $setup
          }
          $signature = Get-AuthenticodeSignature $cdb
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Source-only debugger is not validly signed by Microsoft.'
          }
      - name: Observe exact owned standard-account Win32 calls
        shell: pwsh
        run: |
          # This job produces source-only debugger evidence and no artifacts.
          # Original full source and debugger-free signed customer95 gates remain required.
          ./scripts/test-windows-namespace-trace.ps1
