name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "RustDesk upstream version to fork from (empty = branding/branding.env)"
        required: false
        default: ""
      only:
        description: "Comma list of platform jobs to run: linux,macos,windows (empty = all). Saves CI minutes on partial rebuilds."
        required: false
        default: ""
      publish_r2:
        description: "Publish the build to the live customer download bucket"
        required: true
        type: boolean
        default: false
      runtime_artifact_run:
        description: "Read-only runtime diagnostic using an existing signed payload run (empty = build)"
        required: false
        default: ""
      runtime_linux_artifact_run:
        description: "Artifact-only native Linux session diagnostic using an existing customer DEB run (empty = build)"
        required: false
        default: ""
      runtime_macos_artifact_run:
        description: "Artifact-only macOS runtime diagnostic using an existing signed DMG run (empty = build)"
        required: false
        default: ""

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

jobs:
  # ===========================================================================
  # CONFIG — single source of truth for UPSTREAM_VERSION (branding.env unless
  # workflow_dispatch overrides it).
  # ===========================================================================
  config:
    if: ${{ github.event.inputs.runtime_artifact_run == '' && github.event.inputs.runtime_macos_artifact_run == '' && github.event.inputs.runtime_linux_artifact_run == '' }}
    runs-on: ubuntu-22.04
    outputs:
      upstream_version: ${{ steps.ver.outputs.upstream_version }}
      platforms: ${{ steps.ver.outputs.platforms }}
      linux: ${{ steps.ver.outputs.linux }}
      macos: ${{ steps.ver.outputs.macos }}
      windows: ${{ steps.ver.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify release staging and build configuration
        run: |
          python3 scripts/test-release-pipeline.py
          python3 scripts/test-notarize-macos.py
      - id: ver
        name: Validate build configuration and publication credentials
        env:
          INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          INPUT_ONLY: ${{ inputs.only }}
          PUBLISH_REQUESTED: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_r2 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python3 scripts/release-artifacts.py config

  # ===========================================================================
  # BRIDGE — generate flutter_rust_bridge codegen once for all platforms.
  # ===========================================================================
  bridge:
    needs: config
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      UPSTREAM_VERSION: ${{ needs.config.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc git g++ \
            libssl-dev pkg-config python3 wget unzip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Fetch upstream RustDesk
        run: |
          rm -rf rustdesk
          git clone --depth 1 --branch "${UPSTREAM_VERSION}" --recurse-submodules \
            https://github.com/rustdesk/rustdesk.git rustdesk

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Generate bridge
        working-directory: rustdesk
        run: |
          pushd flutter && sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v6
        with:
          name: bridge-artifact
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h
            rustdesk/flutter/ios/Runner/bridge_generated.h

  # ===========================================================================
  # LINUX — produces .deb
  # ===========================================================================
  linux:
    needs: [config, bridge]
    if: ${{ needs.config.outputs.linux == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      UPSTREAM_VERSION: ${{ needs.config.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake curl gcc git g++ \
            libayatana-appindicator3-dev libasound2-dev libclang-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
            libpam0g-dev libpulse-dev libva-dev \
            libunwind-dev libdw-dev libdwarf-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build pkg-config \
            tree python3 rpm unzip wget xz-utils libssl-dev imagemagick \
            dbus-x11 xvfb xclip xdotool x11-utils openbox

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Restore compiled codec cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: mixel-vcpkg-v1-ubuntu22.04-x64-linux-${{ env.VCPKG_COMMIT_ID }}

      - name: Setup vcpkg + cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg deps
        run: |
          for attempt in 1 2 3; do
            if "$VCPKG_ROOT/vcpkg" install --triplet x64-linux libvpx libyuv opus aom libjpeg-turbo; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            echo "Pinned dependency fetch/build failed; retrying attempt $((attempt + 1))/3"
            sleep "$((attempt * 10))"
          done

      - name: Fetch upstream RustDesk
        run: |
          rm -rf rustdesk
          git clone --depth 1 --branch "${UPSTREAM_VERSION}" --recurse-submodules \
            https://github.com/rustdesk/rustdesk.git rustdesk

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk

      - name: Apply Mixel-Remote branding
        run: ./scripts/apply-branding.sh
        env:
          RDREPO: ./rustdesk
          BRANDING: ./branding

      - name: Restore bridge files
        uses: actions/download-artifact@v7
        with:
          name: bridge-artifact
          path: rustdesk

      - name: Preflight generated support source and reporter
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          RDREPO: ./rustdesk
        run: |
          python3 scripts/test-support-invite.py
          python3 scripts/test-generated-support-paths.py
          python3 scripts/test-support-lease.py
          python3 scripts/test-support-network.py
          python3 scripts/test-secure-support.py
          python3 scripts/test-support-linux.py
          python3 scripts/test-support-signals.py
          python3 scripts/test-support-input.py
          python3 scripts/test-support-clipboard.py --native-x11
          python3 scripts/test-support-video.py
          python3 scripts/test-support-macos.py
          python3 scripts/test-support-wakelock.py
          python3 scripts/test-branding.py
          dart analyze scripts/support-invite-reporter.dart scripts/test-support-invite.dart
          dart scripts/test-support-invite.dart

      - name: Build (cargo + flutter via build.py)
        working-directory: rustdesk
        run: |
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          python3 build.py --flutter

      - name: Test compiled attended support guard
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: python3 scripts/test-compiled-support-guard.py

      - name: Exercise actual Linux cold and warm support launches
        run: python3 scripts/test-support-launch-linux.py --executable rustdesk/flutter/build/linux/x64/release/bundle/mixel-remote

      - name: Locate .deb
        id: locate
        run: |
          deb=$(find rustdesk -name "*.deb" | head -n1)
          if [[ -z "$deb" ]]; then
            echo "❌ no .deb produced" >&2
            find rustdesk -maxdepth 4 -name "*.deb" -o -name "mixel-remote*" -o -name "rustdesk*" | head -20
            exit 1
          fi
          mkdir -p dist
          cp "$deb" "dist/mixel-remote-${UPSTREAM_VERSION}-x86_64.deb"
          ls -la dist/

      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/
          if-no-files-found: error

      - name: Prove actual relay support session on two native Linux desktops
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/test-support-session-linux.py \
            --deb "dist/mixel-remote-${UPSTREAM_VERSION}-x86_64.deb" \
            --proofs artifacts/linux-native --require-native | tee artifacts/linux-native.log

      - name: Prove automatic HTTPS support against an isolated owned relay
        if: ${{ !cancelled() && steps.locate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/test-support-session-https-linux.py \
            --deb "dist/mixel-remote-${UPSTREAM_VERSION}-x86_64.deb" \
            --proofs artifacts/linux-https --require-native \
            --artifact-run-id "$GITHUB_RUN_ID" | tee artifacts/linux-https.log

      - name: Prove incoming recovery when native TCP and UDP fail independently
        if: ${{ !cancelled() && steps.locate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/test-support-session-https-linux.py \
            --deb "dist/mixel-remote-${UPSTREAM_VERSION}-x86_64.deb" \
            --proofs artifacts/linux-mixed --require-native --mixed-transports \
            --artifact-run-id "$GITHUB_RUN_ID" | tee artifacts/linux-mixed.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-support-session-proof
          path: artifacts/
          if-no-files-found: warn

  # ===========================================================================
  # macOS — arm64 + x86_64 on macos-14 (macos-13 runners starve / never start).
  # x86_64 is cross-built on the Apple Silicon runner via the Rust target.
  # ===========================================================================
  macos:
    needs: [config, bridge]
    if: ${{ needs.config.outputs.macos == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: aarch64, target: aarch64-apple-darwin }
          - { arch: x86_64,  target: x86_64-apple-darwin }
    runs-on: macos-14
    timeout-minutes: 180
    env:
      UPSTREAM_VERSION: ${{ needs.config.outputs.upstream_version }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
      APPLE_NOTARY_USER:     ${{ secrets.APPLE_NOTARY_USER }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      APPLE_NOTARY_TEAM_ID:  ${{ secrets.APPLE_NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build runtime
        run: |
          brew install autoconf automake libtool pkg-config create-dmg imagemagick
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version
          # Rosetta helps some Intel toolchain bits when cross-building x86_64.
          if [[ "${{ matrix.job.arch }}" == "x86_64" ]]; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Restore compiled codec cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: mixel-vcpkg-v1-macos14-${{ matrix.job.arch }}-${{ env.VCPKG_COMMIT_ID }}

      - name: Setup vcpkg + cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg deps
        run: |
          triplet=${{ matrix.job.arch == 'aarch64' && 'arm64-osx' || 'x64-osx' }}
          for attempt in 1 2 3; do
            if "$VCPKG_ROOT/vcpkg" install --triplet "$triplet" libvpx libyuv opus aom libjpeg-turbo; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            echo "Pinned dependency fetch/build failed; retrying attempt $((attempt + 1))/3"
            sleep "$((attempt * 10))"
          done

      - name: Fetch upstream RustDesk
        run: |
          rm -rf rustdesk
          git clone --depth 1 --branch "${UPSTREAM_VERSION}" --recurse-submodules \
            https://github.com/rustdesk/rustdesk.git rustdesk

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk
          prefix-key: macos-14-${{ matrix.job.arch }}

      - name: Apply Mixel-Remote branding
        run: ./scripts/apply-branding.sh
        env:
          RDREPO: ./rustdesk
          BRANDING: ./branding
          MIXEL_MACOS_ARCH: ${{ matrix.job.arch }}

      - name: Restore bridge files
        uses: actions/download-artifact@v7
        with:
          name: bridge-artifact
          path: rustdesk

      - name: Import Apple Developer ID cert
        if: env.APPLE_CERT_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          keychain: mixel-build

      - name: Preflight generated support source and reporter
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          RDREPO: ./rustdesk
        run: |
          python3 scripts/test-support-invite.py
          python3 scripts/test-generated-support-paths.py
          python3 scripts/test-support-lease.py
          python3 scripts/test-support-network.py
          python3 scripts/test-secure-support.py
          python3 scripts/test-support-linux.py
          python3 scripts/test-support-signals.py
          python3 scripts/test-support-input.py
          python3 scripts/test-support-clipboard.py
          python3 scripts/test-support-video.py
          python3 scripts/test-support-macos.py
          python3 scripts/test-support-wakelock.py
          python3 scripts/test-branding.py
          dart analyze scripts/support-invite-reporter.dart scripts/test-support-invite.dart
          dart scripts/test-support-invite.dart

      - name: Build (cargo + flutter via build.py)
        working-directory: rustdesk
        run: |
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          export CARGO_BUILD_TARGET="${{ matrix.job.target }}"
          if [ "${{ matrix.job.arch }}" = "aarch64" ]; then
            export FLUTTER_XCODE_ARCHS="arm64"
          else
            export FLUTTER_XCODE_ARCHS="x86_64"
          fi
          for attempt in 1 2 3; do
            if python3 build.py --flutter --unix-file-copy-paste; then
              echo "✓ build succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠ build attempt $attempt failed; retrying after 30s"
            sleep 30
          done
          echo "❌ build failed after 3 attempts"
          exit 1

      - name: Test compiled attended support guard
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          CARGO_BUILD_TARGET: ${{ matrix.job.target }}
        run: python3 scripts/test-compiled-support-guard.py

      - name: Package + sign + notarize (.app then .dmg)
        working-directory: rustdesk
        run: |
          set -euo pipefail
          APP_PATH="flutter/build/macos/Build/Products/Release/Mixel-Remote.app"
          if [[ ! -d "$APP_PATH" ]]; then
            APP_PATH="flutter/build/macos/Build/Products/Release/RustDesk.app"
          fi
          if [[ ! -d "$APP_PATH" ]]; then
            echo "❌ no .app produced" >&2
            find flutter/build -maxdepth 6 -name "*.app" || true
            exit 1
          fi

          # Normalize on-disk name to Mixel-Remote.app for customer-facing DMGs.
          APP_DIR="$(dirname "$APP_PATH")"
          if [[ "$(basename "$APP_PATH")" != "Mixel-Remote.app" ]]; then
            rm -rf "$APP_DIR/Mixel-Remote.app"
            mv "$APP_PATH" "$APP_DIR/Mixel-Remote.app"
            APP_PATH="$APP_DIR/Mixel-Remote.app"
          fi

          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          [[ "$BUNDLE_ID" == "ch.mixel.remote" ]] || { echo "Unexpected macOS bundle identity" >&2; exit 1; }
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")
          ARCH="${{ matrix.job.arch }}"
          [[ "$ARCH" != "aarch64" ]] || ARCH=arm64
          lipo "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE" -verify_arch "$ARCH"
          lipo "$APP_PATH/Contents/Frameworks/liblibrustdesk.dylib" -verify_arch "$ARCH"
          if [[ "${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_r2 }}" == "true" && -z "${APPLE_CERT_P12_BASE64:-}" ]]; then
            echo "Publication requires a signed and notarized macOS app" >&2
            exit 1
          fi
          mkdir -p ../dist
          DMG="../dist/mixel-remote-${UPSTREAM_VERSION}-${{ matrix.job.arch }}.dmg"
          rm -f "$DMG"

          if [[ -n "${APPLE_CERT_P12_BASE64:-}" ]]; then
            CODESIGN_ID=$(security find-identity -v -p codesigning \
              | grep "Developer ID Application" | head -n1 | awk '{print $2}')
            if [[ -z "$CODESIGN_ID" ]]; then
              echo "❌ no Developer ID Application identity in keychain" >&2
              security find-identity -v -p codesigning >&2 || true
              exit 1
            fi

            # 1) Sign .app
            codesign --force --options runtime --timestamp --deep --strict \
              -s "$CODESIGN_ID" "$APP_PATH" -vvv
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"

            # 2) Notarize + staple the .app ITSELF (required for stable TCC grants
            #    after the user drags .app → /Applications). See
            #    scripts/local/sign-and-publish-macos.sh for the full rationale.
            APP_ZIP="../dist/Mixel-Remote-${{ matrix.job.arch }}.zip"
            rm -f "$APP_ZIP"
            ditto -c -k --keepParent "$APP_PATH" "$APP_ZIP"
            python3 ../scripts/notarize-macos.py "$APP_ZIP" \
              --log-dir "../dist/notary-app-${{ matrix.job.arch }}"
            rm -f "$APP_ZIP"
            xcrun stapler staple "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
            spctl --assess --type execute --verbose=2 "$APP_PATH"

            # Exercise this exact signed/stapled app through real URL activation
            # before it becomes a downloadable installer.
            python3 ../scripts/test-support-launch-macos.py --app "$APP_PATH"

            # 3) Package stapled .app into DMG, then sign/notarize/staple DMG.
            create-dmg --window-size 800 400 \
              --icon "Mixel-Remote.app" 200 190 \
              --hide-extension "Mixel-Remote.app" \
              --app-drop-link 600 185 \
              "$DMG" "$APP_PATH"
            codesign --force --options runtime --timestamp --deep --strict \
              -s "$CODESIGN_ID" "$DMG" -vvv
            python3 ../scripts/notarize-macos.py "$DMG" \
              --log-dir "../dist/notary-dmg-${{ matrix.job.arch }}"
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            codesign --verify --strict --verbose=2 "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          else
            create-dmg --window-size 800 400 \
              --icon "Mixel-Remote.app" 200 190 \
              --hide-extension "Mixel-Remote.app" \
              --app-drop-link 600 185 \
              "$DMG" "$APP_PATH"
            echo "⚠ Built unsigned DMG (no APPLE_CERT_P12_BASE64 secret)"
          fi
          ls -la ../dist/

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-notary-${{ matrix.job.arch }}
          path: dist/notary-*/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.job.arch }}
          path: dist/
          if-no-files-found: error

  # ===========================================================================
  # WINDOWS — signed application payload + portable EXE (+ optional MSI).
  # ===========================================================================
  windows:
    needs: [config, bridge]
    if: ${{ needs.config.outputs.windows == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      UPSTREAM_VERSION: ${{ needs.config.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Restore compiled codec cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: mixel-vcpkg-v1-windows2022-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}

      - name: Setup vcpkg + cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg deps
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static libvpx libyuv opus aom libjpeg-turbo; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            echo "Pinned dependency fetch/build failed; retrying attempt $((attempt + 1))/3"
            sleep "$((attempt * 10))"
          done

      - name: Install ImageMagick (for branding .ico)
        shell: bash
        run: |
          choco install imagemagick -y --no-progress || choco install imagemagick.app -y --no-progress || true
          MAGICK_DIR=$(find "/c/Program Files" -maxdepth 1 -type d -name "ImageMagick-*" -print -quit 2>/dev/null || true)
          if [[ -n "$MAGICK_DIR" ]]; then
            "$MAGICK_DIR/magick.exe" -version | head -1
          else
            echo "⚠ ImageMagick not found after choco install — branding will skip .ico regen if magick missing"
          fi

      - name: Fetch upstream RustDesk
        shell: bash
        run: |
          rm -rf rustdesk
          git clone --depth 1 --branch "${UPSTREAM_VERSION}" --recurse-submodules \
            https://github.com/rustdesk/rustdesk.git rustdesk

      - name: Apply Mixel-Remote branding
        shell: bash
        run: |
          export PATH="/c/Program Files/ImageMagick-7*:/c/ProgramData/chocolatey/bin:$PATH"
          # Resolve ImageMagick install dir (versioned folder name).
          MAGICK_DIR=$(find "/c/Program Files" -maxdepth 1 -type d -name "ImageMagick-*" -print -quit 2>/dev/null || true)
          if [[ -n "$MAGICK_DIR" ]]; then
            export PATH="$MAGICK_DIR:$PATH"
          fi
          ./scripts/apply-branding.sh
        env:
          RDREPO: ./rustdesk
          BRANDING: ./branding

      - name: Restore bridge files
        uses: actions/download-artifact@v7
        with:
          name: bridge-artifact
          path: rustdesk

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk
          cache-on-failure: true

      - name: Preflight generated support source and reporter
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          RDREPO: ./rustdesk
        run: |
          python scripts/test-support-invite.py
          python scripts/test-generated-support-paths.py
          python scripts/test-support-lease.py
          python scripts/test-support-network.py
          python scripts/test-secure-support.py
          python scripts/test-support-linux.py
          python scripts/test-support-signals.py
          python scripts/test-support-input.py
          python scripts/test-support-clipboard.py
          python scripts/test-support-video.py
          python scripts/test-support-macos.py
          python scripts/test-support-wakelock.py
          python scripts/test-branding.py
          dart analyze scripts/support-invite-reporter.dart scripts/test-support-invite.dart
          dart scripts/test-support-invite.dart

      - name: Build (cargo + flutter via build.py)
        shell: bash
        working-directory: rustdesk
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          python build.py --flutter --skip-portable-pack

      - name: Test compiled attended support guard
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          python scripts/test-compiled-support-guard.py

      - name: Prepare full application directory for Store packaging
        shell: pwsh
        run: ./scripts/prepare-windows-store-payload.ps1

      - name: Sign compiled Store application
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: mixel-codesigning
          certificate-profile-name: mixel-remote
          files-folder: ${{ github.workspace }}\store-payload
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify and exercise the signed compiled application
        shell: pwsh
        run: |
          ./scripts/verify-windows-payload.ps1 -Payload store-payload
          ./scripts/test-support-launch-windows.ps1 -Executable store-payload/Mixel-Remote.exe

      - name: Build portable launcher from the signed compiled application
        shell: bash
        run: |
          python -m pip install -r rustdesk/libs/portable/requirements.txt
          python scripts/build-windows-portable.py --output "dist/mixel-remote-${UPSTREAM_VERSION}-x86_64.exe"

      - name: Stage optional MSI
        shell: bash
        run: |
          set -euo pipefail
          # The launcher build embeds res/icon.ico after apply-branding.sh.
          # A second PE resource rewrite can silently retain oversized old icons.
          msi=$(find rustdesk -maxdepth 5 -name "*.msi" | head -n1 || true)
          if [[ -n "$msi" ]]; then
            cp "$msi" "dist/mixel-remote-${UPSTREAM_VERSION}-x86_64.msi"
          fi

      # Azure Trusted Signing (Artifact Signing) — account mixel-codesigning,
      # profile mixel-remote (Public Trust, CN=Mixel International Services
      # SARLS). Signs every exe/msi in dist/ including the customer-facing
      # aliases. Service principal: mixel-remote-signing-ci with the
      # "Artifact Signing Certificate Profile Signer" role only.
      # NOTE: signing changes bytes → a fresh build starts with zero
      # SmartScreen reputation regardless; the signature makes the warning
      # milder, shows a real publisher, and builds reputation faster.
      - name: Sign with Azure Trusted Signing
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: mixel-codesigning
          certificate-profile-name: mixel-remote
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Prepare byte-identical signed customer aliases
        shell: pwsh
        run: |
          $release = "dist/mixel-remote-$($env:UPSTREAM_VERSION)-x86_64.exe"
          Copy-Item $release dist/Mixel-Remote-Support-Windows.exe
          Copy-Item $release dist/Mixel-Remote-QS.exe

      - name: Verify Windows Authenticode signatures
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.msi' }) +
            @(Get-ChildItem store-payload -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          if ($installers.Count -eq 0) { throw 'No Windows installer was built.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature: $($installer.Name): $($signature.Status)"
            }
            Write-Host "PASS: $($installer.Name) Authenticode signature is Valid."
          }

      # Retain the verified signed payload for read-only runtime diagnosis even
      # when a later customer launch test fails. R2 publication still requires
      # this entire job (including both customer launch tests) to succeed.
      - name: Package signed Store payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path store-artifact | Out-Null
          Compress-Archive -Path store-payload/* -DestinationPath store-artifact/Mixel-Remote-Store-Payload.zip
          $digest = (Get-FileHash store-artifact/Mixel-Remote-Store-Payload.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path store-artifact/Mixel-Remote-Store-Payload.sha256 -Value $digest -Encoding ascii
          Write-Host "PASS: complete signed Store payload packaged; SHA256 $digest"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-msix-payload
          path: store-artifact/
          if-no-files-found: error

      - name: Exercise the signed portable customer download
        shell: pwsh
        run: |
          ./scripts/test-support-launch-windows.ps1 -Executable dist/Mixel-Remote-Support-Windows.exe -Portable -ExpectedPayload store-payload

      - name: Exercise the signed QuickSupport download without an invite
        shell: pwsh
        run: |
          ./scripts/test-support-launch-windows.ps1 -Executable dist/Mixel-Remote-QS.exe -Portable -QuickSupport -ExpectedPayload store-payload

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  # ===========================================================================
  # Upload — R2, including stable customer-facing aliases.
  # ===========================================================================
  upload:
    needs: [config, linux, macos, windows]
    if: >-
      ${{ always() && !cancelled() && needs.config.result == 'success' &&
          (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
          (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
          (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_r2)) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: mixel-remote-r2-publication
      cancel-in-progress: false
    env:
      UPSTREAM_VERSION: ${{ needs.config.outputs.upstream_version }}
      SELECTED_PLATFORMS: ${{ needs.config.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage exact selected builds and customer aliases
        run: python3 scripts/release-artifacts.py stage

      - name: Upload verified builds to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Publication requires CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Publication requires CLOUDFLARE_ACCOUNT_ID}"
          npm install -g wrangler@4
          # Canonical versions must all upload before customer aliases change.
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          for entry in sorted(manifest['files'], key=lambda item: item['alias']):
              name = entry['name']
              subprocess.run(['wrangler', 'r2', 'object', 'put', f'mixel-remote-binaries/{name}',
                              '--file', f'dist/{name}', '--remote'], check=True)
          subprocess.run(['wrangler', 'r2', 'object', 'put',
                          'mixel-remote-binaries/release-manifest.json', '--file',
                          'dist/release-manifest.json', '--remote'], check=True)
          PY

  runtime:
    if: ${{ github.event.inputs.runtime_artifact_run != '' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate artifact-only diagnostic request
        id: request
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_artifact_run }}
          PUBLISH_REQUESTED: ${{ inputs.publish_r2 }}
        run: python scripts/release-artifacts.py runtime
      - name: Qualify exact ordinary Windows desktop fixture
        shell: pwsh
        run: ./scripts/test-windows-pipeline.ps1
      - name: Prepare Microsoft native crash stack debugger
        shell: pwsh
        run: |
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64/cdb.exe'
          if (-not (Test-Path $cdb)) {
            # Official Microsoft crash-analysis guidance uses this SDK installer
            # and the debugger-only feature. No application bytes are changed.
            $setup = Join-Path $env:RUNNER_TEMP 'mixel-debugger-sdk-setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2173743' -OutFile $setup
            $signature = Get-AuthenticodeSignature $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'Native debugger SDK installer is not validly signed by Microsoft.'
            }
            $installer = Start-Process $setup -ArgumentList '/features','OptionId.WindowsDesktopDebuggers','/q','/norestart' -PassThru -Wait
            if ($installer.ExitCode -notin @(0,3010) -or -not (Test-Path $cdb)) { throw 'Microsoft native debugger preparation failed.' }
            Remove-Item $setup
          }
          $signature = Get-AuthenticodeSignature $cdb
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Native debugger is not validly signed by Microsoft.'
          }
      - uses: actions/download-artifact@v7
        with:
          name: windows-msix-payload
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
          path: signed-payload
      - name: Verify and extract signed payload
        shell: pwsh
        run: |
          $expected = (Get-Content signed-payload/Mixel-Remote-Store-Payload.sha256 -Raw).Trim()
          $actual = (Get-FileHash signed-payload/Mixel-Remote-Store-Payload.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Signed payload checksum differs.' }
          Expand-Archive signed-payload/Mixel-Remote-Store-Payload.zip -DestinationPath runtime-client
          ./scripts/verify-windows-payload.ps1 -Payload runtime-client
      - name: Exercise actual incoming support runtime
        shell: pwsh
        run: |
          ./scripts/test-support-launch-windows.ps1 -Executable runtime-client/Mixel-Remote.exe
      - name: Diagnose signed compiled ordinary-to-QuickSupport ownership
        shell: pwsh
        run: |
          # The retained artifact is the exact signed compiled payload. Pass the
          # native QS argument its portable launcher emits; the full build still
          # requires the actual signed customer QS outer launcher to pass 95s.
          ./scripts/test-support-launch-windows.ps1 -Executable runtime-client/Mixel-Remote.exe -QuickSupport -ExpectedPayload runtime-client -OrdinaryThenQuickSupport -CompiledQuickSupportDiagnostic -NativeCrashDiagnostic
      - name: Save synthetic runtime diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-diagnostics | Out-Null
          foreach ($root in @((Join-Path $env:APPDATA 'Mixel-Remote'), (Join-Path $env:LOCALAPPDATA 'Mixel-Remote'))) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Filter '*.log' -File | ForEach-Object {
                Copy-Item $_.FullName (Join-Path runtime-diagnostics $_.Name) -Force
              }
            }
          }
          $ownedLogs = Join-Path $env:RUNNER_TEMP 'mixel-owned-ordinary-qs-logs'
          if (Test-Path $ownedLogs) {
            Copy-Item $ownedLogs runtime-diagnostics/owned-ordinary-profile -Recurse
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: support-runtime-diagnostics-${{ matrix.os }}
          path: runtime-diagnostics/

  runtime-macos:
    if: ${{ github.event.inputs.runtime_macos_artifact_run != '' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate artifact-only diagnostic request
        id: request
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_macos_artifact_run }}
          PUBLISH_REQUESTED: ${{ inputs.publish_r2 }}
        run: python3 scripts/release-artifacts.py runtime
      - uses: actions/download-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
          path: runtime-artifacts
      - name: Enable Intel runtime when using Apple Silicon
        if: matrix.arch == 'x86_64'
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then
            softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Verify signed DMG and exercise its actual macOS application
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(runtime-artifacts/mixel-remote-*-"${EXPECTED_ARCH}".dmg)
          if [[ ${#DMGS[@]} -ne 1 || ! -s "${DMGS[0]}" ]]; then
            echo "Expected exactly one nonempty signed DMG for $EXPECTED_ARCH" >&2
            exit 1
          fi
          DMG="${DMGS[0]}"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          WORK="$(mktemp -d "${RUNNER_TEMP}/mixel-macos-runtime.XXXXXX")"
          MOUNT="$WORK/mount"
          MOUNTED=false
          cleanup() {
            if [[ "$MOUNTED" == true ]]; then
              hdiutil detach "$MOUNT" -quiet || hdiutil detach "$MOUNT" -force -quiet
            fi
            rm -rf "$WORK"
          }
          trap cleanup EXIT
          mkdir -p "$MOUNT" runtime-diagnostics
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly -quiet
          MOUNTED=true
          [[ -d "$MOUNT/Mixel-Remote.app" ]] || { echo "Signed DMG contains no Mixel-Remote.app" >&2; exit 1; }
          APP_PATH="$WORK/Mixel-Remote.app"
          ditto "$MOUNT/Mixel-Remote.app" "$APP_PATH"
          hdiutil detach "$MOUNT" -quiet
          MOUNTED=false
          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          [[ "$BUNDLE_ID" == ch.mixel.remote ]] || { echo "Unexpected macOS bundle identity" >&2; exit 1; }
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")
          ARCH="$EXPECTED_ARCH"
          [[ "$ARCH" != aarch64 ]] || ARCH=arm64
          lipo "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE" -verify_arch "$ARCH"
          lipo "$APP_PATH/Contents/Frameworks/liblibrustdesk.dylib" -verify_arch "$ARCH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          python3 scripts/test-support-launch-macos.py --app "$APP_PATH" | tee "runtime-diagnostics/macos-${EXPECTED_ARCH}.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-support-runtime-diagnostics-${{ matrix.arch }}
          path: runtime-diagnostics/

  runtime-linux:
    if: ${{ github.event.inputs.runtime_linux_artifact_run != '' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        transport: [native, https, mixed]
    steps:
      - uses: actions/checkout@v5
      - name: Validate artifact-only diagnostic request
        id: request
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_linux_artifact_run }}
          PUBLISH_REQUESTED: ${{ inputs.publish_r2 }}
        run: python3 scripts/release-artifacts.py runtime
      - name: Collect and verify exact Linux artifact provenance
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ steps.request.outputs.run_id }}
        run: |
          python3 scripts/collect-linux-runtime-artifact.py \
            --run-id "$RUNTIME_RUN_ID" --output runtime-artifacts \
            --github-output "$GITHUB_OUTPUT"
          mkdir -p artifacts/application-provenance
          cp runtime-artifacts/run-metadata.json runtime-artifacts/artifact-provenance.json \
            artifacts/application-provenance/
      - name: Prove real relay consent, video, input, files and recovery
        shell: bash
        env:
          TRANSPORT: ${{ matrix.transport }}
          ARTIFACT_ROOT: ${{ steps.artifact.outputs.artifact_root }}
          ARTIFACT_SOURCE: ${{ steps.artifact.outputs.source_commit }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          ARTIFACT_RUN_ID: ${{ steps.request.outputs.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DEBS=(runtime-artifacts/artifacts/linux/mixel-remote-*-x86_64.deb)
          [[ ${#DEBS[@]} == 1 && -s "${DEBS[0]}" ]] || { echo 'Expected exactly one customer installer' >&2; exit 1; }
          mkdir -p artifacts
          HARNESS=scripts/test-support-session-linux.py
          OPTIONS=()
          if [[ "$TRANSPORT" == https || "$TRANSPORT" == mixed ]]; then HARNESS=scripts/test-support-session-https-linux.py; fi
          if [[ "$TRANSPORT" == mixed ]]; then OPTIONS+=(--mixed-transports); fi
          python3 "$HARNESS" \
            --deb "${DEBS[0]}" --proofs artifacts/session --require-native \
            --artifact-root "$ARTIFACT_ROOT" --artifact-source-commit "$ARTIFACT_SOURCE" \
            --expected-sha256 "$ARTIFACT_SHA256" --artifact-run-id "$ARTIFACT_RUN_ID" \
            "${OPTIONS[@]}" | tee artifacts/session.log
      - name: Prove a valid saved password still requires customer Accept
        if: ${{ !cancelled() && matrix.transport == 'https' && steps.artifact.outcome == 'success' }}
        env:
          ARTIFACT_ROOT: ${{ steps.artifact.outputs.artifact_root }}
          ARTIFACT_DEB: ${{ steps.artifact.outputs.deb }}
          ARTIFACT_SOURCE: ${{ steps.artifact.outputs.source_commit }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          ARTIFACT_RUN_ID: ${{ steps.request.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/test-support-session-https-linux.py \
            --deb "$ARTIFACT_DEB" --proofs artifacts/saved-password-consent \
            --require-native --saved-password-consent \
            --artifact-root "$ARTIFACT_ROOT" --artifact-source-commit "$ARTIFACT_SOURCE" \
            --expected-sha256 "$ARTIFACT_SHA256" --artifact-run-id "$ARTIFACT_RUN_ID" \
            | tee artifacts/saved-password-consent.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-support-session-${{ matrix.transport }}
          path: artifacts/
          if-no-files-found: warn
