name: Windows active Bash boundary

on:
  pull_request:
    paths:
      - scripts/test-support-native-warnings.py
      - scripts/test-support-flutter-analysis.py
      - scripts/test-windows-generated-source.sh
      - scripts/test-windows-lease-observation.py
      - scripts/test-support-lease.py
      - scripts/test-support-directory-security.py
      - .github/workflows/windows-shell-boundary.yml
      - .github/workflows/preflight.yml
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-bash-boundary:
    name: Active Git Bash to native Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove the exact active shell and fatal source wiring boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:GITHUB_WORKSPACE 'shell-boundary-proof'
          New-Item -ItemType Directory -Path $proof -ErrorAction Stop | Out-Null
          $env:TMPDIR = Join-Path $proof 'temporary'
          New-Item -ItemType Directory -Path $env:TMPDIR -ErrorAction Stop | Out-Null
          $env:MIXEL_SHELL_BOUNDARY_EVIDENCE = $proof
          @'
          import json
          import os
          from pathlib import Path
          import runpy

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          proof = Path(os.environ['MIXEL_SHELL_BOUNDARY_EVIDENCE']).resolve()
          assert proof.parent == root and proof.name == 'shell-boundary-proof'
          assert Path(os.environ['TMPDIR']).resolve() == proof / 'temporary'
          controls = runpy.run_path(str(root / 'scripts/test-support-native-warnings.py'), run_name='mixel_shell_boundary_controls')
          selected = Path(r'C:\Program Files\Git\bin\bash.exe')
          bash = controls['qualified_bash'](selected, True)
          assert bash == str(selected.resolve())
          controls['shell_path_controls'](proof)
          controls['wiring_controls'](proof, bash)
          result_path = proof / 'boundary-result.json'
          result_path.write_text(json.dumps({
              'active_bash': bash,
              'strict_existing_git_bash_validator': True,
              'seven_non_git_refusals': True,
              'real_windows_native_python_argv_boundary': True,
              'four_unix_wiring_first_fatal': 27,
              'windows_dispatch_first_fatal': 27,
              'later_dart_unrun': True,
              'native_application_or_signing_executed': False,
          }, indent=2) + '\n', encoding='utf-8')
          payload = result_path.read_bytes()
          assert payload.endswith(b'\n') and not payload.endswith(b'\\n')
          assert json.loads(payload)['native_application_or_signing_executed'] is False
          print('PASS: exact installed Git Bash/native Python boundary and existing fatal wiring controls; application and signing gates remain separate.')
          '@ | python -u - 2>&1 | Tee-Object -FilePath (Join-Path $proof 'stdout.log')
          if ($LASTEXITCODE -ne 0) { throw 'Exact active Git Bash boundary controls failed.' }
      - name: Prove native Dart argv before the complete Windows source checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:GITHUB_WORKSPACE 'shell-boundary-proof'
          $env:TMPDIR = Join-Path $proof 'temporary'
          @'
          import json
          import os
          from pathlib import Path
          import runpy
          import sys
          import unittest

          assert sys.platform == 'win32', 'Requires the actual Windows source runner'
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          proof = root / 'shell-boundary-proof'
          assert proof.is_dir() and Path(os.environ['TMPDIR']).resolve() == proof / 'temporary'
          sdk = proof / 'Dart SDK préflight 🚀'
          sdk.mkdir()
          dart = sdk / 'dart'
          dart.write_text('#!/bin/sh\nexit 73\n', encoding='utf-8')
          dart.chmod(0o755)
          os.environ['PATH'] = str(sdk) + os.pathsep + os.environ['PATH']
          sys.path.insert(0, str(root / 'scripts'))
          controls = runpy.run_path(str(root / 'scripts/test-windows-lease-observation.py'), run_name='mixel_native_dart_argv_controls')
          case = controls['ObservationControls']('test_actual_source_dispatch_runs_reader_before_fatal_native_gate')
          result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(unittest.TestSuite([case]))
          assert result.testsRun == 1 and not result.skipped and result.wasSuccessful(), 'Native Dart argv source boundary failed'
          (proof / 'dart-argv-result.json').write_text(json.dumps({
              'source_test_count': result.testsRun,
              'actual_windows_git_bash_to_native_python': sys.platform == 'win32',
              'owned_sdk_path_contains_spaces_and_unicode': True,
              'ordinary_and_complete_source_dispatch_checked': True,
              'original_fatal_source_guards_23_and_24_preserved': True,
              'native_application_signing_and_runtime_qualified': False,
          }, indent=2) + '\n', encoding='utf-8')
          print('PASS: native Dart argv spelling and original fatal dispatcher ordering; source controls only; host=' + sys.platform)
          '@ | python -u - 2>&1 | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'shell-boundary-proof/dart-argv.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native Dart argv source boundary controls failed.' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-active-bash-boundary-${{ matrix.os }}
          path: |
            shell-boundary-proof/*.log
            shell-boundary-proof/*.json
            shell-boundary-proof/*.stdout
            shell-boundary-proof/*.stderr
            shell-boundary-proof/*/calls.jsonl
          if-no-files-found: ignore
          retention-days: 3
