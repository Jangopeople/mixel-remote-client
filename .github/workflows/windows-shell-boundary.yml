name: Windows active Bash boundary

on:
  pull_request:
    paths:
      - scripts/test-support-native-warnings.py
      - scripts/test-support-flutter-analysis.py
      - scripts/test-windows-generated-source.sh
      - scripts/test-windows-lease-observation.py
      - scripts/test-support-lease.py
      - scripts/test-support-directory-security.py
      - .github/workflows/windows-shell-boundary.yml
      - .github/workflows/preflight.yml
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-bash-boundary:
    name: Active Git Bash to native Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove the exact active shell and fatal source wiring boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:GITHUB_WORKSPACE 'shell-boundary-proof'
          New-Item -ItemType Directory -Path $proof -ErrorAction Stop | Out-Null
          $env:TMPDIR = Join-Path $proof 'temporary'
          New-Item -ItemType Directory -Path $env:TMPDIR -ErrorAction Stop | Out-Null
          $env:MIXEL_SHELL_BOUNDARY_EVIDENCE = $proof
          @'
          import json
          import os
          from pathlib import Path
          import runpy

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          proof = Path(os.environ['MIXEL_SHELL_BOUNDARY_EVIDENCE']).resolve()
          assert proof.parent == root and proof.name == 'shell-boundary-proof'
          assert Path(os.environ['TMPDIR']).resolve() == proof / 'temporary'
          controls = runpy.run_path(str(root / 'scripts/test-support-native-warnings.py'), run_name='mixel_shell_boundary_controls')
          selected = Path(r'C:\Program Files\Git\bin\bash.exe')
          bash = controls['qualified_bash'](selected, True)
          assert bash == str(selected.resolve())
          controls['shell_path_controls'](proof)
          controls['wiring_controls'](proof, bash)
          result_path = proof / 'boundary-result.json'
          result_path.write_text(json.dumps({
              'active_bash': bash,
              'strict_existing_git_bash_validator': True,
              'seven_non_git_refusals': True,
              'real_windows_native_python_argv_boundary': True,
              'four_unix_wiring_first_fatal': 27,
              'windows_dispatch_first_fatal': 27,
              'later_dart_unrun': True,
              'native_application_or_signing_executed': False,
          }, indent=2) + '\n', encoding='utf-8')
          payload = result_path.read_bytes()
          assert payload.endswith(b'\n') and not payload.endswith(b'\\n')
          assert json.loads(payload)['native_application_or_signing_executed'] is False
          print('PASS: exact installed Git Bash/native Python boundary and existing fatal wiring controls; application and signing gates remain separate.')
          '@ | python -u - 2>&1 | Tee-Object -FilePath (Join-Path $proof 'stdout.log')
          if ($LASTEXITCODE -ne 0) { throw 'Exact active Git Bash boundary controls failed.' }
      - name: Prove native Dart argv before the complete Windows source checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:GITHUB_WORKSPACE 'shell-boundary-proof'
          $env:TMPDIR = Join-Path $proof 'temporary'
          @'
          import json
          import os
          from pathlib import Path
          import runpy
          import sys
          import unittest

          assert sys.platform == 'win32', 'Requires the actual Windows source runner'
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          proof = root / 'shell-boundary-proof'
          assert proof.is_dir() and Path(os.environ['TMPDIR']).resolve() == proof / 'temporary'
          sdk = proof / 'Dart SDK préflight 🚀'
          sdk.mkdir()
          dart = sdk / 'dart'
          dart.write_text('#!/bin/sh\nexit 73\n', encoding='utf-8')
          dart.chmod(0o755)
          os.environ['PATH'] = str(sdk) + os.pathsep + os.environ['PATH']
          sys.path.insert(0, str(root / 'scripts'))
          controls = runpy.run_path(str(root / 'scripts/test-windows-lease-observation.py'), run_name='mixel_native_dart_argv_controls')
          case = controls['ObservationControls']('test_actual_source_dispatch_runs_reader_before_fatal_native_gate')
          result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(unittest.TestSuite([case]))
          assert result.testsRun == 1 and not result.skipped and result.wasSuccessful(), 'Native Dart argv source boundary failed'
          (proof / 'dart-argv-result.json').write_text(json.dumps({
              'source_test_count': result.testsRun,
              'actual_windows_git_bash_to_native_python': sys.platform == 'win32',
              'owned_sdk_path_contains_spaces_and_unicode': True,
              'ordinary_and_complete_source_dispatch_checked': True,
              'original_fatal_source_guards_23_and_24_preserved': True,
              'native_application_signing_and_runtime_qualified': False,
          }, indent=2) + '\n', encoding='utf-8')
          print('PASS: native Dart argv spelling and original fatal dispatcher ordering; source controls only; host=' + sys.platform)
          '@ | python -u - 2>&1 | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'shell-boundary-proof/dart-argv.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native Dart argv source boundary controls failed.' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-active-bash-boundary-${{ matrix.os }}
          path: |
            shell-boundary-proof/*.log
            shell-boundary-proof/*.json
            shell-boundary-proof/*.stdout
            shell-boundary-proof/*.stderr
            shell-boundary-proof/*/calls.jsonl
          if-no-files-found: ignore
          retention-days: 3

  actual-windows-lifecycle-dart:
    name: Real Dart lifecycle before complete source suite (${{ matrix.os }})
    if: github.repository == 'Jangopeople/mixel-remote-client' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/current77-windows-lifecycle-dart'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
      - name: Check out only the two pinned upstream lifecycle inputs
        uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.6
          path: lifecycle-upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /flutter/lib/utils/event_loop.dart
            /flutter/lib/models/file_model.dart
      - name: Resolve canonical installed Windows Dart executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import os,sys; from pathlib import Path; sys.path.insert(0,'scripts'); from sdk_discovery import find_dart; binary=find_dart(); assert binary and Path(binary).is_file() and binary.endswith('.exe'); stream=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n'); stream.write('DART_BIN='+binary+'\n'); stream.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed Dart SDK is required.' }
      - name: Run all nine actual lifecycle controls through the corrected Bash caller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,importlib.util,json,os,re,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert os.name=='nt' and sys.platform=='win32'
          proof=root/'lifecycle-dart-proof';proof.mkdir()
          runner=Path(os.environ['RUNNER_TEMP']).resolve()/'mixel-lifecycle-early';runner.mkdir()
          spec=importlib.util.spec_from_file_location('pinned_lifecycle',root/'scripts/patch-support-file-dialog-lifecycle.py')
          patch=importlib.util.module_from_spec(spec);spec.loader.exec_module(patch)
          originals={patch.SOURCE:patch.ORIGINAL_SHA,patch.MODEL:patch.MODEL_SHA}
          upstream=root/'lifecycle-upstream'
          for name,expected in originals.items():
              raw=subprocess.check_output(['git','-C',str(upstream),'show','HEAD:'+name],timeout=30)
              assert hashlib.sha256(raw).hexdigest()==expected,'Exact original lifecycle input required'
              path=runner/'mixel-sdk-source/pipeline-lf'/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
          bash=Path(os.environ['ProgramFiles'])/'Git/bin/bash.exe';assert bash.is_file()
          env=dict(os.environ,RUNNER_TEMP=runner.as_posix(),MIXEL_LIFECYCLE_PYTHON=Path(sys.executable).resolve().as_posix())
          probe=proof/'probe.py'
          probe.write_text('import json,sys; print(json.dumps(sys.argv[1:]))\n',encoding='utf-8')
          env['MIXEL_LIFECYCLE_PROBE']=probe.as_posix()
          selected=subprocess.run([str(bash),'-c','"$MIXEL_LIFECYCLE_PYTHON" "$MIXEL_LIFECYCLE_PROBE" "$(command -v dart)" "${DART_BIN:-$(command -v dart)}"'],env=env,cwd=root,capture_output=True,text=True,encoding='utf-8',timeout=15)
          assert selected.returncode==0, 'Actual Bash/native Python argv observation failed'
          legacy,actual=json.loads(selected.stdout)
          assert Path(actual).is_file() and Path(actual).resolve()==Path(env['DART_BIN']).resolve()
          record={'scope':'actual-Windows-Dart-lifecycle-source-tests-only','platform':sys.platform,
              'runnerImage':os.environ.get('ImageOS'),'legacy_command_v_native_argv':legacy,
              'legacy_argument_is_file':Path(legacy).is_file(),'selected_native_argv':actual,
              'selected_argument_is_file':True,'canonical_export_selected':True,'originalSourceHashes':originals,
              'nativeApplicationStarted':False,'customerAppQualified':False,'publication':False,'passed':False}
          (proof/'dart-argv.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          dispatcher=(root/'scripts/test-windows-generated-source.sh').read_text(encoding='utf-8')
          commands=[line for line in dispatcher.splitlines() if line.startswith('python scripts/test-support-file-dialog-lifecycle.py ')]
          assert len(commands)==1 and ' --dart "${DART_BIN:-$(command -v dart)}" ' in commands[0]
          prefix='python(){ "$MIXEL_LIFECYCLE_PYTHON" "$@"; }\n'
          result=subprocess.run([str(bash),'-e','-o','pipefail','-c',prefix+commands[0]],env=env,cwd=root,capture_output=True,text=True,encoding='utf-8',timeout=180)
          (proof/'lifecycle.stdout').write_text(result.stdout,encoding='utf-8')
          (proof/'lifecycle.stderr').write_text(result.stderr,encoding='utf-8')
          print(result.stdout);print(result.stderr,file=sys.stderr)
          record.update(lifecycleExitCode=result.returncode,lifecyclePassed=result.returncode==0 and bool(re.search(r'Ran 9 tests in [^\n]+\n\nOK\n\Z',result.stderr)))
          (proof/'dart-argv.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          assert record['lifecyclePassed'],'All nine real Dart lifecycle tests must run and pass without skips'
          tail=[line for line in dispatcher.splitlines() if line.startswith('dart ')]
          expected=['dart analyze scripts/support-invite-reporter.dart scripts/test-support-invite.dart','dart scripts/test-support-invite.dart']
          assert tail==expected and dispatcher.count('\n'.join(tail))==1,'Exact untouched reporter tail required'
          reporter=subprocess.run([str(bash),'-e','-o','pipefail','-c','\n'.join(tail)],env=env,cwd=root,capture_output=True,text=True,encoding='utf-8',timeout=120)
          (proof/'reporter-tail.stdout').write_bytes(reporter.stdout.encode('utf-8'))
          (proof/'reporter-tail.stderr').write_bytes(reporter.stderr.encode('utf-8'))
          print(reporter.stdout);print(reporter.stderr,file=sys.stderr)
          tail_receipt={'scope':'exact-dispatcher-reporter-tail-source-tests-only','commands':tail,'exitCode':reporter.returncode,
              'stdoutSha256':hashlib.sha256(reporter.stdout.encode()).hexdigest(),'stderrSha256':hashlib.sha256(reporter.stderr.encode()).hexdigest(),
              'nativeApplicationStarted':False,'customerAppQualified':False,'releaseQualified':False,'publication':False}
          (proof/'reporter-tail-result.json').write_text(json.dumps(tail_receipt,indent=2)+'\n',encoding='utf-8')
          record.update(reporterTailExitCode=reporter.returncode,reporterTailPassed=reporter.returncode==0,
              passed=record['lifecyclePassed'] and reporter.returncode==0)
          (proof/'dart-argv.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          assert record['passed'],'The exact reporter analyzer and execution tail must also pass'
          print('PASS: actual Windows canonical Dart argv, all nine lifecycle controls and exact reporter tail; application/release qualification remains false.')
          '@ | python -u -
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows Dart lifecycle failed before the complete source suite.' }
      - name: Retain exact early lifecycle source and argv evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-real-dart-lifecycle-${{ matrix.os }}
          path: |
            lifecycle-dart-proof/*.json
            lifecycle-dart-proof/*.stdout
            lifecycle-dart-proof/*.stderr
            ${{ runner.temp }}/mixel-lifecycle-early/mixel-file-dialog-lifecycle/
          if-no-files-found: warn
          retention-days: 7
