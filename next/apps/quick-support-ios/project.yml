name: MixelQuickSupport
options:
  bundleIdPrefix: ch.mixel
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 5277F8NDH4
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: false
    TARGETED_DEVICE_FAMILY: "1,2"
    # The host core is a static library written in Rust; it needs these system parts.
    OTHER_LDFLAGS: ["-lc++", "-lresolv"]
targets:
  QuickSupport:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - framework: QuickHost.xcframework
        embed: false
      - target: Broadcast
        embed: true
      - sdk: ReplayKit.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.mixel.quicksupport
        PRODUCT_NAME: Mixel Quick Support
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Quick Support
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/App.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)ch.mixel.quicksupport.shared"]
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    dependencies:
      - framework: QuickHost.xcframework
        embed: false
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.mixel.quicksupport.broadcast
        PRODUCT_NAME: Broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Mixel Quick Support
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)ch.mixel.quicksupport.shared"]
