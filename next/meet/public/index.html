<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b3162f">
<title>Mixel Meet</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="meet.css">
</head>
<body>
<main id="start">
  <header><h1>Mixel Meet</h1><p id="start-title" data-t>Meeting</p></header>
  <section class="card" id="code-card" hidden>
    <label><span data-t>Meeting code</span><input id="code" autocomplete="off" autocapitalize="none" placeholder="abcd-efgh-jkmn"></label>
    <button id="code-go" class="primary" type="button" data-t>Continue</button>
  </section>
  <section class="card" id="join-card" hidden>
    <video id="preview" autoplay playsinline muted></video>
    <div class="row">
      <button id="pre-mic" type="button" aria-pressed="false" data-t>Microphone</button>
      <button id="pre-cam" type="button" aria-pressed="false" data-t>Camera</button>
    </div>
    <label><span data-t>Your name</span><input id="name" maxlength="40" autocomplete="name"></label>
    <button id="join" class="primary" type="button" data-t>Join meeting</button>
    <p class="hint" data-t>Sound and picture go directly between the participants and are encrypted.</p>
  </section>
  <section class="card" id="wait-card" hidden><p id="wait-text"></p><button id="wait-leave" type="button" data-t>Leave</button></section>
  <p id="status" role="status"></p>
</main>
<div id="meeting" hidden>
  <div id="stage" hidden><video id="stage-video" autoplay playsinline muted></video><span id="stage-name"></span></div>
  <div id="tiles"></div>
  <aside id="side" hidden>
    <div id="side-head"><strong id="side-title"></strong><button id="side-close" type="button" aria-label="Close">×</button></div>
    <div id="people" hidden><div id="knocks"></div><div id="people-list"></div><label class="check" id="lock-row" hidden><input id="lock" type="checkbox"><span data-t>Lock the meeting (nobody else can ask to join)</span></label></div>
    <div id="chat" hidden><div id="chat-log" aria-live="polite"></div><form id="chat-form"><input id="chat-text" maxlength="1000" autocomplete="off" placeholder="Message" data-t-placeholder><button type="submit" data-t>Send</button></form></div>
  </aside>
  <nav id="controls">
    <button id="c-mic" type="button" aria-pressed="false" data-t>Microphone</button>
    <button id="c-cam" type="button" aria-pressed="false" data-t>Camera</button>
    <button id="c-screen" type="button" aria-pressed="false" data-t>Share screen</button>
    <button id="c-chat" type="button" data-t>Chat</button>
    <button id="c-people" type="button"><span data-t>People</span> <span id="people-count"></span></button>
    <button id="c-invite" type="button" data-t>Copy invitation</button>
    <button id="c-leave" type="button" class="danger" data-t>Leave</button>
    <button id="c-end" type="button" class="danger" hidden data-t>End for all</button>
  </nav>
  <p id="toast" role="status" hidden></p>
</div>
<script type="module" src="meet.js"></script>
</body>
</html>
