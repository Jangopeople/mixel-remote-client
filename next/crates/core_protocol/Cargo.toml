[package]
name = "core_protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
native-webrtc = ["dep:webrtc", "dep:tokio", "dep:async-trait", "dep:bytes", "dep:rtc", "dep:futures-util", "dep:tokio-rustls", "dep:rustls-native-certs"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
rand_core.workspace = true
zeroize.workspace = true
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
x25519-dalek = "2.0.1"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
bytes = { version = "1", optional = true }
web-time = "1"
rtc = { version = "=0.21.1", default-features = false, optional = true }
webrtc = { version = "=0.21.1", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "io-util", "net"], optional = true }
async-trait = { version = "0.1", optional = true }
bincode = { version = "=2.0.1", features = ["serde"] }
futures-util = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rcgen = "=0.14.10"
turn = { version = "=0.11.0", features = ["metrics"] }
turn-util = { package = "webrtc-util", version = "=0.12.0", default-features = false, features = ["conn", "vnet"] }
