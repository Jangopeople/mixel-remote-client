[package]
name = "web_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core_protocol = { path = "../core_protocol" }
serde_json = "1"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
rand_core.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["RtcPeerConnection", "RtcConfiguration", "RtcDataChannel", "RtcDataChannelInit", "RtcIceTransportPolicy", "HtmlVideoElement", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
js-sys = "0.3"

[lints]
workspace = true
