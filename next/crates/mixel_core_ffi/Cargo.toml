[package]
name = "mixel_core_ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Mixel Remote engine for the native apps (Swift through UniFFI; Windows through mixel_core_capi)"

[lib]
name = "mixel_core_ffi"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The Swift binding generator (host tool only; never linked into the apps).
bindgen = ["uniffi/cli"]
qa-session = ["mixel_engine/qa-session"]

[dependencies]
mixel_engine = { path = "../mixel_engine" }
signaling_server = { path = "../signaling_server" }
core_protocol = { path = "../core_protocol", features = ["native-webrtc"] }
uniffi = "=0.31.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
serde = { workspace = true }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
zeroize.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
native_os_capture = { path = "../native_os_capture" }

[target.'cfg(target_os = "windows")'.dependencies]
native_os_capture = { path = "../native_os_capture" }

[lints]
workspace = true
