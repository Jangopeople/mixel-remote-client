[package]
name = "native_os_capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
core_protocol = { path = "../core_protocol" }
uuid = { version = "1", features = ["v4"] }
thiserror.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSApplication", "NSPanel", "NSResponder", "NSWindow", "NSOpenPanel", "NSSavePanel"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSArray", "NSEnumerator", "NSError", "NSString", "NSURL", "NSBundle", "NSDate", "NSRunLoop"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCStream", "SCShareableContent", "libc", "objc2-core-foundation", "block2", "dispatch2", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMBlockBuffer", "CMFormatDescription", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow", "CGDirectDisplay", "CGColorSpace", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "CGDisplayConfiguration", "CGGeometry", "CGError", "libc"] }
block2 = "0.6"
dispatch2 = "0.3"

# The H.264 decoder of the iPhone/iPad controller (VideoToolbox, as on the Mac).
[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMBlockBuffer", "CMFormatDescription", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTErrors", "VTDecompressionSession", "VTDecompressionProperties", "VTSession", "objc2", "block2", "objc2-core-media", "objc2-core-video"] }
block2 = "0.6"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-video-toolbox]
version = "0.3.2"
default-features = false
features = ["std", "VTErrors", "VTCompressionSession", "VTCompressionProperties", "VTDecompressionSession", "VTDecompressionProperties", "VTSession", "objc2", "block2", "objc2-core-media", "objc2-core-video"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
default-features = false
features = ["std", "CFDictionary", "CFNumber", "CFString"]

[dev-dependencies]
openh264 = "=0.9.9"
h264-reader = "=0.9.0"
core_protocol = { path = "../core_protocol", features = ["native-webrtc"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "=0.13.2", features = ["xkb", "xtest"] }

[build-dependencies]
cc = "1.11"

# Android phones decode with openh264 when the app's own hardware decoder is not used.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
openh264 = "=0.9.9"
h264-reader = "=0.9.0"
