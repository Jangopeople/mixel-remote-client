[workspace]
resolver = "2"
exclude = ["vendor/webrtc", "vendor/nix"]
members = ["crates/core_protocol", "crates/signaling_server", "crates/web_client", "crates/native_os_capture", "crates/mixel_engine", "crates/desktop_app", "crates/mobile_app", "crates/quick_host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
webrtc = { path = "vendor/webrtc" }
# nix 0.31.3 with two Mac-only constants no longer assumed on iPhone (needed by the phone host core).
nix = { path = "vendor/nix" }
