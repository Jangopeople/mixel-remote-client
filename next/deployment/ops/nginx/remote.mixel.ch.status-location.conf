    # Mixel Remote public status (written every 2 minutes by mixel-remote-health). Inserted before
    # "location /api/billing/" in /etc/nginx/sites-available/remote.mixel.ch.conf; the portal Worker
    # passes /api/status to the origin.
    location = /api/status {
        default_type application/json;
        alias /var/www/mixel-remote-status/status.json;
        add_header Cache-Control "public, max-age=30" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        limit_except GET { deny all; }
    }
