# Mixel Remote per-IP request limits (nginx http context): /etc/nginx/conf.d/mixel-remote-limits.conf
# Source: mixel-remote-client next/deployment/ops/nginx/. Used by
#   /etc/nginx/snippets/mixel-remote-limits-ism-api.conf  (included in the ism-api.mixel.ch server)
#   the /v1/ws location of /etc/nginx/sites-available/mixel-remote-next-qa.conf (rs.mixel.ch:9444)
# ism-api.mixel.ch and rs.mixel.ch are DNS-only (not behind Cloudflare), so $binary_remote_addr is
# the client. Empty keys are not counted: each zone only sees the endpoints named in its map.
# Per-tenant limits live in the database functions (sign-ups 50/h, invitations 100/day per company,
# deploy links 50/day per company + uses per link + plan device limit, support codes 30/h per user);
# the billing service limits per company and account (rateLimitPerMinute).

# Password, PKCE and MFA steps of the sign-in (GoTrue). A sign-in is 1-3 requests.
map "$request_method:$uri:$arg_grant_type" $mixel_remote_signin_key {
    default "";
    "~^POST:/auth/v1/token:(password|pkce|id_token)$" $binary_remote_addr;
    "~^POST:/auth/v1/verify:" $binary_remote_addr;
    "~^POST:/auth/v1/factors/[^/]+/(verify|challenge):" $binary_remote_addr;
}
# Requests that send an e-mail (sign-up, code, password reset, magic link).
map "$request_method:$uri" $mixel_remote_mail_key {
    default "";
    "~^POST:/auth/v1/(signup|otp|recover|magiclink|resend)$" $binary_remote_addr;
}
# Account-level actions that are abuse targets: company sign-up, invitations, support codes,
# sign-in options lookup (e-mail domain probing), deploy links, domains, phone registration.
map "$request_method:$uri" $mixel_remote_rpc_key {
    default "";
    "~^(GET|POST):/rest/v1/rpc/(remote_saas_signup|remote_saas_invite_member|remote_saas_resend_invite|remote_saas_accept_invite|remote_create_support_code|remote_enroll_with_support_code|remote_support_code_device|remote_saas_sign_in_options|remote_saas_create_deploy_link|remote_saas_add_domain|remote_saas_verify_domain|remote_create_personal_account|remote_quick_phone_register|remote_quick_phone_claim)$" $binary_remote_addr;
}
# Device registration (deploy-link enrolment, add this computer, self-removal). Generous burst:
# a mass rollout starts hundreds of computers behind one company address at once.
map "$request_method:$uri" $mixel_remote_enroll_key {
    default "";
    "~^POST:/rest/v1/rpc/(remote_enroll_with_token|remote_saas_add_this_device|remote_register_personal_device|remote_enroll_device|remote_add_device|remote_device_self_remove)$" $binary_remote_addr;
}
# Device tickets of the identity authority (every app start and renewal).
map "$request_method:$uri" $mixel_remote_ticket_key {
    default "";
    "~^POST:/v1/(device-ticket|startup-host-ticket)$" $binary_remote_addr;
}

limit_req_zone $mixel_remote_signin_key zone=mixel_remote_signin:10m rate=20r/m;
limit_req_zone $mixel_remote_mail_key   zone=mixel_remote_mail:10m   rate=5r/m;
limit_req_zone $mixel_remote_rpc_key    zone=mixel_remote_rpc:10m    rate=30r/m;
limit_req_zone $mixel_remote_enroll_key zone=mixel_remote_enroll:10m rate=120r/m;
limit_req_zone $mixel_remote_ticket_key zone=mixel_remote_ticket:10m rate=120r/m;
# New broker WebSocket connections per address (rs.mixel.ch:9444/v1/ws). Open connections are not
# capped per address: a company can have many computers behind one address (the broker caps 1000).
limit_req_zone $binary_remote_addr      zone=mixel_remote_ws:10m     rate=120r/m;

# The maps above pushed the server past the default variables hash (nginx warned "could not build
# optimal variables_hash" on reload). Not set anywhere else on this server.
variables_hash_max_size 2048;
