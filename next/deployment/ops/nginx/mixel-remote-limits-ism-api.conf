# Included in the ism-api.mixel.ch server block (/etc/nginx/sites-available/ism-api.mixel.lu.conf):
#   include /etc/nginx/snippets/mixel-remote-limits-ism-api.conf;
# Zones and keys: /etc/nginx/conf.d/mixel-remote-limits.conf. Applies to every location of the server
# that has no limit_req of its own (none has). Requests beyond the burst get 429.
limit_req zone=mixel_remote_signin burst=30 nodelay;
limit_req zone=mixel_remote_mail burst=10 nodelay;
limit_req zone=mixel_remote_rpc burst=30 nodelay;
limit_req zone=mixel_remote_enroll burst=600 nodelay;
limit_req zone=mixel_remote_ticket burst=600 nodelay;
limit_req_status 429;
limit_req_log_level warn;
