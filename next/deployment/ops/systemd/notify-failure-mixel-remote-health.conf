# /etc/systemd/system/notify-failure@mixel-remote-health.service.service.d/dedup.conf
# mixel-remote-health de-duplicates itself (alerts on new failures + hourly reminder); this is only
# the safety net (a crash of the monitor itself alerts at most hourly, see guarded_main); it must stay
# below the 2-minute run interval so that a new failure soon after an alert is not swallowed.
[Service]
Environment=OPS_ALARM_DEDUP_SECONDS=60
