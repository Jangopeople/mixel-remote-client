<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixel Remote viewer</title><link rel="stylesheet" href="style.css"></head><body class="standalone-viewer">
<header class="viewer-topbar"><div class="viewer-brand"><img src="mixel-icon.png" alt=""><div><h1>Mixel Remote</h1><p>Attended connection · local test window</p></div></div><span>Local connection test</span></header>
<main class="viewer-body"><div class="viewer-toolbar"><button id="connect" class="button-primary">Request view-only</button><button id="connect-keyboard" class="button-secondary">Request keyboard control</button><button id="disconnect" class="button-danger" disabled>End session</button></div><p id="viewer-status" class="viewer-notice" role="status">Checking video support…</p><div class="viewer-screen"><canvas id="remote-video" width="640" height="420" aria-label="WebRTC received native screen"></canvas></div><p id="viewer-metrics" class="viewer-caption">No received video</p><div class="viewer-input"><label for="remote-text">Send text</label><input id="remote-text" maxlength="256" value="Mixel input Grüezi 中文 😀"><button id="send-text" class="button-primary" disabled>Send encrypted text</button><button id="test-keys" class="button-secondary" disabled>Test key release</button></div><p id="input-status" role="status">No active keyboard session</p><p class="viewer-caption">This local test shares only Mixel Remote’s own test window over real encrypted WebRTC. The host must accept before any screen or input is shared.</p></main><script src="viewer.js"></script></body></html>
