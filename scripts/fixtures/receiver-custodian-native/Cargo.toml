[package]
name = "mixel-receiver-custodian-component"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
anyhow = "=1.0.98"
bytes = { version = "=1.10.1", features = ["serde"] }
futures-util = { version = "=0.3.31", features = ["sink", "io", "channel"] }
log = "=0.4.22"
protobuf = { version = "=3.7.2", features = ["with-bytes"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.118"
tokio = { version = "=1.44.2", features = ["full"] }
uuid = { version = "=1.16.0", features = ["v4"] }

[build-dependencies]
protobuf-codegen = "=3.7.2"

[[test]]
name = "custody"
path = "native-main.rs"
harness = false

[[test]]
name = "original-negative"
path = "native-main-original.rs"
harness = false

[features]
flutter = []
plugin_framework = []

[workspace]
