[package]
name = "mixel-receiver-input-component"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
[dependencies]
bytes = "=1.10.1"
protobuf = { version = "=3.7.2", features = ["with-bytes"] }
uuid = { version = "=1.16.0", features = ["v4"] }
[target.'cfg(target_os = "macos")'.dependencies]
dispatch = "=0.2.0"
[build-dependencies]
protobuf-codegen = "=3.7.2"
[[test]]
name = "receiver"
path = "tests/receiver.rs"
harness = false
[features]
guard-must-not-send = []
flutter = []
plugin_framework = []
[workspace]
